# 物品字符串ID
物品ID: minecraft:diamond
# 物品特殊值也叫 aux
物品Meta: 0
# 物品显示名
名字: 演示魔法物品
# 玩家使用时获得的药水
获得药水:
  - 1:1:10
  - 2:1:2
# 玩家使用时获得的群体药水
群体药水:
  - 1:1:10
  - 2:1:2
# 药水作用范围
药水范围: 5
# 暂且无用
群体药水作用对象: 0
# 玩家使用时是否产生雷击
使用雷击: false
# 管理员权限执行命令
# 可使用变量：
# {player}   玩家名
OP指令:
  - say {player}
# 玩家自身执行命令
以玩家身份执行:
  - me test
# 物品附魔，格式：
# 附魔ID:附魔等级
附魔:
  - 0:1
# 物品 Lore
显示:
  - 第一行
  - 第二行
# 使用是否会消耗物品
使用消耗: false
# 回收价格，使用 EconomyAPI 经济
# 为 0 时不回收
回收价格: 0
# 暂且无用
职业限制: 无
# 物品使用冷却，单位秒
冷却时间: 0
# 玩家获得物品时（仅通过命令 /mi give 获取时），发送给玩家的消息
获得提示: 恭喜获得魔法物品
# 玩家获得物品时（仅通过命令 /mi give 获取时），发送给全服玩家的消息
# 可使用变量：
# {player}   玩家名
全服提示: 恭喜 {player} 获得魔法物品
